server:
  port: ${PORT:8081}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

  rabbitmq:
    listener:
      simple:
        auto-startup: false

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  jwt:
    secret: ${JWT_SECRET:CardProSuperSecretKeyThatIsLongEnoughForHS2561234567890}
  internal:
    api-key: ${INTERNAL_API_KEY:cardpro-secret-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    discovery:
      enabled: false
    eureka:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false
    amqp:
      enabled: false