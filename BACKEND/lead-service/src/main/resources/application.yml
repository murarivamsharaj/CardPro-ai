server:
  port: ${PORT:8084}

spring:
  application:
    name: lead-service
  datasource:
    url: jdbc:postgresql://${LEAD_DB_HOST:localhost}:${LEAD_DB_PORT:5432}/${LEAD_DB_NAME:lead_db}
    username: ${LEAD_DB_USERNAME:postgres}
    password: ${LEAD_DB_PASSWORD:murari}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: false
    baseline-on-migrate: false
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: CardProSuperSecretKeyThatIsLongEnoughForHS2561234567890
  internal:
    api-key: ${INTERNAL_API_KEY:cardpro-local-secret}
  service:
    card-url: ${CARD_SERVICE_URL:http://localhost:8082} # 👈 Direct URL fallback for Feign bypassing Eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always