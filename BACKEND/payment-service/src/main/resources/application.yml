server:
  port: ${PORT:8088}

spring:
  application:
    name: payment-service

  # 1. Disable RabbitMQ listener auto-startup
  rabbitmq:
    listener:
      simple:
        auto-startup: false
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:cardpro}
    password: ${RABBITMQ_PASSWORD:cardpro}

  datasource:
    url: jdbc:postgresql://${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:5432}/${PAYMENT_DB_NAME:payment_db}
    username: ${PAYMENT_DB_USERNAME:postgres}
    password: ${PAYMENT_DB_PASSWORD:murari}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# 2. Disable Eureka Client completely
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  internal:
    api-key: ${INTERNAL_API_KEY:cardpro-local-secret}
  jwt:
    secret: ${JWT_SECRET:CardProSuperSecretKeyThatIsLongEnoughForHS2561234567890}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_TQnTopgwwCYbNN}
    key-secret: ${RAZORPAY_KEY_SECRET:9mEw4VScMpxSv7qdqHngi0D8}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:dummy-webhook-secret}
    currency: INR

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always