server:
  port: ${PORT:8765}

spring:
  application:
    name: gateway-service
  cloud:
    discovery:
      enabled: false
      client:
        composite-indicator:
          enabled: false
        health-indicator:
          enabled: false
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:3000"
              - "https://frontend-two-kohl-2uyfslpb5o.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**

        - id: auth-service
          uri: ${AUTH_SERVICE_URL:https://auth-service-lcfr.onrender.com}
          predicates:
            - Path=/api/v1/auth/**

        - id: card-service
          uri: lb://card-service
          predicates:
            - Path=/api/v1/cards/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**

        - id: card-analytics
          uri: lb://card-service
          predicates:
            - Path=/api/v1/analytics/**

        - id: card-files
          uri: lb://card-service
          predicates:
            - Path=/api/v1/files/**

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**

        - id: lead-service
          uri: lb://lead-service
          predicates:
            - Path=/api/v1/leads/**

app:
  jwt:
    secret: CardProSuperSecretKeyThatIsLongEnoughForHS2561234567890
    expiration: 86400000

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    defaults:
      enabled: true
    discovery:
      enabled: false
    eureka:
      enabled: false
    redis:
      enabled: false