server:
  port: 8765

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      # Global CORS Configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true

      # Route Definitions
      routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**

            - id: card-service
              uri: lb://card-service
              predicates:
                - Path=/api/v1/cards/**

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**

            # Analytics + file uploads are served by the card-service
            - id: card-analytics
              uri: lb://card-service
              predicates:
                - Path=/api/v1/analytics/**

            - id: card-files
              uri: lb://card-service
              predicates:
                - Path=/api/v1/files/**

            - id: lead-service
              uri: lb://lead-service
              predicates:
                - Path=/api/v1/leads/**

app:
  jwt:
    secret: CardProSuperSecretKeyThatIsLongEnoughForHS2561234567890
    expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/
  instance:
    prefer-ip-address: true