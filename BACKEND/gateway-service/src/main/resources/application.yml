server:
  port: ${PORT:8765}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      default-filters:
        - DeduplicateResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:3000"
              - "https://frontend-two-kohl-2uyfslpb5o.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # payment-service is declared first so its /api/v1/payments/**
        # predicates are matched before any catch-all route.
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: card-service
          uri: lb://card-service
          predicates:
            - Path=/api/v1/cards/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**

        - id: card-analytics
          uri: lb://card-service
          predicates:
            - Path=/api/v1/analytics/**

        - id: card-files
          uri: lb://card-service
          predicates:
            - Path=/api/v1/files/**

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**

        - id: lead-service
          uri: lb://lead-service
          predicates:
            - Path=/api/v1/leads/**

app:
  jwt:
    secret: CardProSuperSecretKeyThatIsLongEnoughForHS2561234567890
    expiration: 86400000

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:eureka}:${EUREKA_PASSWORD:eureka123}@${EUREKA_HOST:discovery-service}:8761/eureka/
  instance:
    prefer-ip-address: true