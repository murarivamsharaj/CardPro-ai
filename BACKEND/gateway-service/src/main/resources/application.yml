server:
  port: ${PORT:8765}

spring:
  application:
    name: gateway-service
  cloud:
    discovery:
      enabled: false
      client:
        composite-indicator:
          enabled: false
        health-indicator:
          enabled: false
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # Auth Service Route
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:https://auth-service-lcfr.onrender.com}
          predicates:
            - Path=/api/v1/auth/**

        # Card Service Core Routes
        - id: card-service
          uri: ${CARD_SERVICE_URL:https://card-service-3a7a.onrender.com}
          predicates:
            - Path=/api/v1/cards/**, /api/v1/public/cards/**

        # Card Analytics Route
        - id: card-analytics
          uri: ${CARD_SERVICE_URL:https://card-service-3a7a.onrender.com}
          predicates:
            - Path=/api/v1/analytics/**

        # Card Files / Uploads Route
        - id: card-files
          uri: ${CARD_SERVICE_URL:https://card-service-3a7a.onrender.com}
          predicates:
            - Path=/api/v1/files/**

        # User Service Route
        - id: user-service
          uri: ${USER_SERVICE_URL:https://user-service-tri0.onrender.com}
          predicates:
            - Path=/api/v1/users/**

        # Payment Service Route
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:https://payment-service-1glq.onrender.com}
          predicates:
            - Path=/api/v1/payments/**

        # Lead Service Route
        - id: lead-service
          uri: ${LEAD_SERVICE_URL:https://lead-service-s094.onrender.com}
          predicates:
            - Path=/api/v1/leads/**

        # Product Service Route
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:https://product-service-bdlp.onrender.com}
          predicates:
            - Path=/api/v1/products/**

        # Order Service Route
        - id: order-service
          uri: ${ORDER_SERVICE_URL:https://order-service-7ypr.onrender.com}
          predicates:
            - Path=/api/v1/orders/**

        # AI Service Route
        - id: ai-service
          uri: ${AI_SERVICE_URL:https://ai-service-8w36.onrender.com}
          predicates:
            - Path=/api/v1/ai/**

app:
  jwt:
    secret: ${JWT_SECRET:CardProSuperSecretKeyThatIsLongEnoughForHS2561234567890}
    expiration: 86400000

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    defaults:
      enabled: true
    discovery:
      enabled: false
    eureka:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false