server:
  port: ${PORT:8082}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: card-service

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${CARD_DB_HOST:localhost}:${CARD_DB_PORT:5432}/${CARD_DB_NAME:card_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${CARD_DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${CARD_DB_PASSWORD:murari}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  cloud:
    discovery:
      enabled: false
      client:
        composite-indicator:
          enabled: false
        health-indicator:
          enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
  instance:
    hostname: localhost
    prefer-ip-address: false

app:
  jwt:
    secret: ${JWT_SECRET:CardProSuperSecretKeyThatIsLongEnoughForHS2561234567890}
  internal:
    api-key: ${INTERNAL_API_KEY:cardpro-secret-key}
  cache:
    profile-ttl-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    discovery:
      enabled: false
    eureka:
      enabled: false
    redis:
      enabled: false