server:
  port: ${PORT:8082}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: card-service

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

  rabbitmq:
    listener:
      simple:
        auto-startup: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  cloud:
    discovery:
      enabled: false
      client:
        composite-indicator:
          enabled: false
        health-indicator:
          enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
  instance:
    hostname: localhost
    prefer-ip-address: false

app:
  jwt:
    secret: ${JWT_SECRET:CardProSuperSecretKeyThatIsLongEnoughForHS2561234567890}
  internal:
    api-key: ${INTERNAL_API_KEY:cardpro-secret-key}
  cache:
    profile-ttl-seconds: 300

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    discovery:
      enabled: false
    eureka:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false
    amqp:
      enabled: false