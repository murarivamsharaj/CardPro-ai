server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: murari
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Disable Flyway for initial development
  # Enable later when database scripts are ready
  flyway:
    enabled: false

  # Redis configuration
  # Keep this only if your auth module uses Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms


# Eureka Discovery Server
# For local IntelliJ testing use localhost
eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka123@localhost:8761/eureka/
  instance:
    hostname: localhost       # 👈 Add this new line
    prefer-ip-address: false  # 👈 Change this from 'true' to 'false'


# Application custom configuration
app:
  jwt:
    secret: CardProSuperSecretKeyThatIsLongEnoughForHS2561234567890

    # 24 hours
    expiration-ms: 86400000

    # 30 days refresh token
    refresh-expiration-ms: 2592000000


  internal:
    api-key: cardpro-secret-key


# SpringDoc Swagger UI Configuration (Explicitly added)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    tags-sorter: alpha
    operations-sorter: alpha


# Actuator monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: TRACE
    org.springdoc: DEBUG