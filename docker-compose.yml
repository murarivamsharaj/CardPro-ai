# CardPro AI — Full-Stack Docker Compose (repo root)
#
# ⚠️ This file is a thin wrapper. All backend service definitions (ports,
#    env, healthchecks, networks, volumes) live in the CANONICAL file:
#
#        BACKEND/docker-compose.yml
#
#    This file includes it and additionally defines the `frontend` service
#    (nginx serving the built React app, proxying /api to the gateway).
#
#    Keep backend edits in BACKEND/docker-compose.yml ONLY, so the two files
#    cannot drift out of sync. Run the backend alone with:
#
#        docker compose -f BACKEND/docker-compose.yml up -d --build
#
#    Run the full stack (backend + frontend) from the repo root with:
#
#        docker compose up -d --build

# Same project as BACKEND/docker-compose.yml so this file is a superset
# entry point to the SAME stack (backend containers + frontend), not a
# parallel deployment that fights over host ports.
name: cardpro-backend

include:
  - path: BACKEND/docker-compose.yml

services:
  # ------------------------------------------------------------------ Frontend
  frontend:
    build: ./FRONTEND
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - gateway-service
    networks:
      # cardpro-network is defined by the included BACKEND/docker-compose.yml
      - cardpro-network
