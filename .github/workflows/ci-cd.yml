name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # JOB 1 — Build & Test (CI)
  # Compiles every backend microservice into a JAR and builds the
  # React frontend, then publishes the JARs as artifacts for Job 2.
  # ------------------------------------------------------------------
  build-test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: BACKEND/pom.xml

      - name: Build backend microservice JARs
        working-directory: BACKEND
        run: mvn clean package -DskipTests

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: FRONTEND/yarn.lock

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        working-directory: FRONTEND
        run: yarn install

      - name: Build frontend
        working-directory: FRONTEND
        run: yarn build

      # Publish the JARs so the CD job can bake them into Docker images.
      - name: Upload discovery-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: discovery-service-jar
          path: BACKEND/discovery-service/target/*.jar
          if-no-files-found: error

      - name: Upload gateway-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: gateway-service-jar
          path: BACKEND/gateway-service/target/*.jar
          if-no-files-found: error

      - name: Upload auth-service JAR
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: BACKEND/auth-service/target/*.jar
          if-no-files-found: error

  # ------------------------------------------------------------------
  # JOB 2 — Docker Image Creation & Push (CD)
  # Downloads the JARs from Job 1 and publishes cardpro images to
  # Docker Hub: ${{ secrets.DOCKER_USERNAME }}/cardpro-<service>:latest
  # ------------------------------------------------------------------
  docker-build-push:
    name: Docker Image Creation & Push (CD)
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        service: [ discovery-service, gateway-service, auth-service ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download ${{ matrix.service }} JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: BACKEND/${{ matrix.service }}/target

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: BACKEND/${{ matrix.service }}
          file: BACKEND/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cardpro-${{ matrix.service }}:latest

  # ------------------------------------------------------------------
  # JOB 3 — Simulated Deployment
  # Stubs out the production deploy: the SSH handshake and the
  # docker-compose commands are echoed so the pipeline can be wired
  # to a real server later by swapping these echo steps for an SSH action.
  # ------------------------------------------------------------------
  deploy-simulated:
    name: Simulated Deployment
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Simulate secure SSH connection to production
        run: echo "🔐 Establishing secure SSH connection to production server (simulated)..."

      - name: Simulate docker-compose pull on production
        run: echo "docker-compose pull"

      - name: Simulate docker-compose up -d on production
        run: echo "docker-compose up -d"

      - name: Deployment complete
        run: echo "✅ Deployment Successful!"
