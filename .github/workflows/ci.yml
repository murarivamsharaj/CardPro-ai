name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [discovery-service, gateway-service, auth-service, card-service, lead-service, ai-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build ${{ matrix.service }}
        run: |
          cd BACKEND/${{ matrix.service }}
          mvn clean compile -DskipTests
      - name: Run Tests
        run: |
          cd BACKEND/${{ matrix.service }}
          mvn test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Removed cache lines so the pipeline does not crash on missing lockfiles
      - name: Install dependencies
        run: |
          cd FRONTEND
          yarn install --no-lockfile
      - name: Build
        run: |
          cd FRONTEND
          yarn build
      - name: Lint
        run: |
          cd FRONTEND
          yarn lint
