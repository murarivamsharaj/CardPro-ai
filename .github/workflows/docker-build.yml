name: Docker Image Build

on:
  push:
    branches: [ main ]
    paths:
      - 'BACKEND/**'
      - 'FRONTEND/**'
      - 'docker-compose.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          docker compose build
